`Aumento dei punteggi di caratteristica=Aumenta di 2 un punteggio di caratteristica a tua scelta, oppure di 1 due punteggi diversi (massimo 20). Se il DM lo consente puoi invece scegliere un talento. Segna l'aumento nei campi "Bonus caratteristica" di questo tratto.
Aumento dei punteggi di caratteristica@24=Ottieni un talento a tua scelta di cui rispetti i requisiti, di solito il talento "Aumento dei punteggi di caratteristica" (+2 a un punteggio o +1 a due, massimo 20). Segna l'aumento nei campi "Bonus caratteristica" di questo tratto.
Scelta della sottoclasse=Scegli la sottoclasse della tua classe: da ora ottieni le sue caratteristiche ai livelli segnati come "Caratteristica di sottoclasse". Puoi importarle da un link di 5e.tools nella tab Contenuti o scriverle a mano.
Sentiero primordiale|Collegio bardico|Dominio divino|Circolo druidico|Archetipo marziale|Tradizione monastica|Giuramento sacro|Archetipo del ranger|Archetipo ladresco|Origine stregonesca|Patrono ultraterreno|Tradizione arcana=Scegli la sottoclasse della tua classe: ti dà caratteristiche a questo livello e ai successivi segnati come "Caratteristica di sottoclasse". Puoi importarle da un link di 5e.tools nella tab Contenuti o scriverle a mano.
Caratteristica di sottoclasse=Ricevi la caratteristica prevista a questo livello dalla tua sottoclasse. Aggiungila importandola da 5e.tools (tab Contenuti) o scrivendola a mano.
Dono epico=Ottieni un talento della categoria Dono Epico a tua scelta: sono talenti molto potenti disponibili al livello 19.
Ira=Come azione bonus entri in ira per 1 minuto: vantaggio alle prove e ai TS di Forza, bonus ai danni degli attacchi in mischia con Forza (+2, poi +3 al livello 9 e +4 al 16) e resistenza ai danni contundenti, perforanti e taglienti. Non puoi lanciare incantesimi né concentrarti. L'ira finisce se non attacchi né subisci danni durante un tuo turno, o se cadi incosciente. Usi: 2 (livello 1), 3 (3), 4 (6), 5 (12), 6 (17), illimitati (20); si recuperano con un riposo lungo.
Ira@24=Come azione bonus (non con armatura pesante) entri in ira per 1 minuto: resistenza ai danni contundenti, perforanti e taglienti, bonus ai danni con gli attacchi di Forza e vantaggio alle prove e ai TS di Forza. Non puoi lanciare incantesimi né concentrarti. L'ira si prolunga se attacchi, costringi qualcuno a un TS o usi un'azione bonus per mantenerla. Gli usi (da 2 a 6) si recuperano in parte con un riposo breve e del tutto con uno lungo; il bonus ai danni cresce con il livello.
Difesa senza armatura~Barbaro=Senza armatura indossata la tua CA è 10 + modificatore di Destrezza + modificatore di Costituzione. Puoi usare uno scudo.
Difesa senza armatura~Monaco=Senza armatura né scudo la tua CA è 10 + modificatore di Destrezza + modificatore di Saggezza.
Attacco irruento=Al tuo primo attacco del turno puoi attaccare con vantaggio i tiri per colpire con Forza in mischia, ma fino al tuo prossimo turno anche i tiri per colpirti hanno vantaggio.
Percezione del pericolo=Hai vantaggio ai tiri salvezza su Destrezza contro effetti che puoi vedere, come trappole e incantesimi. Non funziona se sei accecato, assordato o incapacitato.
Attacco extra=Quando usi l'azione di Attacco puoi attaccare due volte invece di una.
Attacco extra (2)=Quando usi l'azione di Attacco puoi attaccare tre volte invece di una.
Attacco extra (3)=Quando usi l'azione di Attacco puoi attaccare quattro volte invece di una.
Due attacchi extra=Quando usi l'azione di Attacco puoi attaccare tre volte invece di una.
Tre attacchi extra=Quando usi l'azione di Attacco puoi attaccare quattro volte invece di una.
Movimento veloce=La tua velocità aumenta di 3 metri se non indossi armatura pesante.
Istinto ferale=Hai vantaggio ai tiri di iniziativa. Se sei sorpreso all'inizio del combattimento puoi agire normalmente nel primo turno, se entri in ira prima di fare altro.
Istinto ferale@24=Hai vantaggio ai tiri di iniziativa.
Critico brutale=Quando metti a segno un colpo critico con un attacco in mischia tiri un dado di danno dell'arma in più (due al livello 13, tre al 17).
Ira incessante=Se scendi a 0 PF mentre sei in ira e non muori sul colpo, puoi fare un TS su Costituzione (CD 10) per restare a 1 PF. La CD aumenta di 5 a ogni uso successivo, finché non finisci un riposo breve o lungo.
Ira incessante@24=Se scendi a 0 PF mentre sei in ira, puoi fare un TS su Costituzione (CD 10): se riesci, i tuoi PF diventano pari al doppio del tuo livello da barbaro. La CD aumenta di 5 a ogni uso, finché non finisci un riposo.
Ira persistente=La tua ira finisce prima solo se cadi incosciente o se la termini tu: non si interrompe più per mancanza di attacchi o danni.
Ira persistente@24=Quando tiri l'iniziativa recuperi tutti gli usi di Ira consumati (una volta per riposo lungo). La tua ira finisce prima solo se sei privo di sensi o se la termini tu.
Forza indomabile=Se il risultato di una prova di Forza è inferiore al tuo punteggio di Forza, puoi usare il punteggio al posto del risultato.
Campione primordiale=I tuoi punteggi di Forza e Costituzione aumentano di 4; il loro massimo diventa 24.
Padronanza delle armi=Puoi usare le proprietà di padronanza di alcune armi a tua scelta; il numero dipende dalla classe e cresce con il livello. Dopo un riposo lungo puoi cambiare la scelta.
Conoscenza primordiale=Ottieni competenza in un'abilità a scelta fra quelle del Barbaro. Dal livello 10, mentre sei in ira, puoi usare Forza per alcune prove di abilità (Acrobazia, Furtività, Intimidire, Percezione, Sopravvivenza).
Balzo istintivo=Quando entri in ira puoi muoverti fino a metà della tua velocità come parte della stessa azione bonus.
Colpo brutale=Quando usi Attacco Irruento puoi rinunciare al vantaggio su un attacco con Forza: se colpisci infliggi 1d10 danni extra e applichi un effetto a scelta, come spingere il bersaglio o rallentarlo.
Colpo brutale migliorato=Il Colpo Brutale ottiene altri effetti possibili. Al livello 17 il danno extra sale a 2d10 e puoi applicare due effetti con lo stesso attacco.
Incantesimi~Bardo=Lanci incantesimi da bardo con Carisma come caratteristica da incantatore, usando uno strumento musicale come focus. Conosci un certo numero di trucchetti e di incantesimi (nel 2024 li prepari) e hai slot come indicato dalla tabella della classe.
Ispirazione bardica=Come azione bonus dai a una creatura entro 18 m un dado di ispirazione (d6, d8 al livello 5, d10 al 10, d12 al 15): entro 10 minuti può aggiungerlo a una prova, a un tiro per colpire o a un TS. Usi pari al tuo modificatore di Carisma (minimo 1), recuperati con un riposo lungo (breve dal livello 5).
Ispirazione bardica@24=Come azione bonus dai a una creatura entro 18 m un dado di Ispirazione Bardica (d6, d8 al livello 5, d10 al 10, d12 al 15): nell'ora seguente può aggiungerlo a una prova, a un tiro per colpire o a un TS. Usi pari al tuo modificatore di Carisma (minimo 1), recuperati con un riposo lungo.
Tuttofare=Aggiungi metà del tuo bonus di competenza (arrotondato per difetto) alle prove di caratteristica in cui non sei competente.
Canto di riposo=Durante un riposo breve, se tu e i tuoi alleati ascoltate la tua esibizione, chi spende dadi vita recupera un dado extra (d6, poi d8 al livello 9, d10 al 13, d12 al 17).
Maestria=Scegli due abilità in cui sei competente: il tuo bonus di competenza vale il doppio per le prove con quelle abilità. Ne scegli altre due al secondo avanzamento della caratteristica.
Fonte di ispirazione=Recuperi gli usi di Ispirazione Bardica anche con un riposo breve.
Fonte di ispirazione@24=Recuperi tutti gli usi di Ispirazione Bardica con un riposo breve o lungo, e puoi spendere uno slot incantesimo per recuperarne uno.
Controfascino=Come azione dai a te e agli alleati entro 9 m, fino alla fine del tuo prossimo turno, vantaggio ai TS contro l'essere spaventati o ammaliati.
Controfascino@24=Come reazione, quando tu o un alleato entro 9 m fallite un TS contro l'essere ammaliati o spaventati, potete ripeterlo con vantaggio.
Segreti magici=Impari due incantesimi a tua scelta da qualsiasi classe (anche trucchetti): contano come incantesimi da bardo. Ne ottieni altri due ai livelli 14 e 18.
Segreti magici@24=Aggiungi alla tua lista di incantesimi da bardo incantesimi di Chierico, Druido e Mago (e puoi prepararli come incantesimi da bardo).
Ispirazione superiore=Quando tiri l'iniziativa e non ti restano usi di Ispirazione Bardica, ne recuperi uno.
Ispirazione superiore@24=Quando tiri l'iniziativa e hai meno di due usi di Ispirazione Bardica, li recuperi fino ad averne due.
Parole della creazione=Hai sempre preparati Parola del potere: guarire e Parola del potere: uccidere e puoi lanciarli senza slot (una volta ciascuno per riposo lungo). Quando li lanci puoi bersagliare una seconda creatura entro 3 m dalla prima.
Incantesimi~Chierico=Lanci incantesimi da chierico con Saggezza, preparandoli ogni giorno dalla lista della classe e usando un simbolo sacro come focus.
Ordine divino=Scegli un ruolo: Protettore (competenza con armature pesanti e armi da guerra) oppure Taumaturgo (un trucchetto in più e bonus alle prove di Arcano e Religione).
Incanalare divinità~Chierico=Come azione presenti il tuo simbolo sacro per usare Scacciare i Non Morti o un effetto del tuo dominio. Usi: 1 (livello 2), 2 (6), 3 (18); si recuperano con un riposo breve o lungo.
Incanalare divinità~Chierico@24=Incanali energia divina per Scintilla Divina (danni o cure), Scacciare i Non Morti e gli effetti della tua sottoclasse. Hai 2 usi (3 al livello 6, 4 al 18): ne recuperi uno con un riposo breve e tutti con uno lungo.
Distruggere non morti=Quando un non morto fallisce il TS contro Scacciare i Non Morti viene distrutto se la sua GS è pari o inferiore a una soglia (1/2 al livello 5, 1 all'8, 2 all'11, 3 al 14, 4 al 17).
Intervento divino=Come azione invochi l'aiuto della tua divinità: tira d100; se il risultato è pari o inferiore al tuo livello da chierico la divinità interviene (l'effetto lo scegli d'accordo col DM). Se funziona non puoi riusarlo per 7 giorni, altrimenti puoi riprovare dopo un riposo lungo.
Intervento divino@24=Come azione magica scegli un incantesimo da chierico di livello 5 o inferiore e lo lanci senza slot né componenti materiali. Dopo l'uso non puoi riutilizzarlo finché non finisci un riposo lungo.
Intervento divino migliorato=Il tuo Intervento Divino riesce automaticamente, senza bisogno di tirare.
Bruciare i non morti=Quando usi Scacciare i Non Morti, i non morti che falliscono il TS subiscono danni radiosi pari a un numero di d8 uguale al tuo modificatore di Saggezza (minimo 1).
Colpi benedetti=Una volta per turno, quando infliggi danni con un attacco con arma o con un trucchetto, aggiungi 1d8 danni radiosi o necrotici.
Colpi benedetti migliorati=Il danno extra di Colpi Benedetti sale a 2d8.
Grande intervento divino=Quando usi Intervento Divino puoi lanciare Desiderio; se lo fai non potrai riusare l'Intervento Divino per un periodo di alcuni riposi lunghi.
Druidico=Conosci il Druidico, il linguaggio segreto dei druidi: puoi usarlo per lasciare messaggi nascosti che solo chi lo conosce riconosce.
Incantesimi~Druido=Lanci incantesimi da druido con Saggezza, preparandoli ogni giorno dalla lista della classe e usando un focus druidico.
Forma selvatica=Come azione (nel 2024 azione bonus) ti trasformi in una bestia che hai già visto, mantenendo personalità e competenze. Il limite di GS, il tipo di movimento e la durata dipendono dal livello. Hai 2 usi (nel 2024 uno si recupera con un riposo breve, tutti con uno lungo). Se i PF della forma arrivano a 0 torni alla tua forma con il danno in eccesso. Gestisci le forme nella sezione dedicata del tab Companion.
Forma selvatica migliorata=Il limite di GS e i movimenti consentiti aumentano: GS 1/2 e nuotare al livello 4, GS 1 e volare all'8.
Incantesimi bestiali=Puoi lanciare i tuoi incantesimi mentre sei in Forma Selvatica, con i soli componenti somatici e verbali.
Corpo senza tempo~Druido=Invecchi molto più lentamente (1 anno ogni 10) e gli effetti magici di invecchiamento non ti toccano.
Corpo senza tempo~Monaco=Non subisci più gli effetti dell'invecchiamento e non hai più bisogno di cibo e acqua.
Arcidruido=Puoi usare Forma Selvatica quante volte vuoi e ignori i componenti verbali, somatici e materiali (senza costo) degli incantesimi da druido.
Arcidruido@24=Quando tiri l'iniziativa e non ti restano usi di Forma Selvatica ne recuperi uno. Puoi convertire usi di Forma Selvatica in slot incantesimo e viceversa (una volta per riposo lungo) e invecchi molto più lentamente.
Ordine primordiale=Scegli un ruolo: guardiano (competenza con armature medie e armi da guerra) oppure ruolo magico (un trucchetto in più e bonus alle prove di Arcano e Natura).
Compagno selvatico=Spendi un uso di Forma Selvatica o uno slot incantesimo per lanciare Trova familiare: il famiglio è una fata e dura finché non lo scacci.
Rinascita selvatica=Puoi spendere uno slot incantesimo per recuperare un uso di Forma Selvatica, o spendere un uso di Forma Selvatica per recuperare uno slot di livello 1 (una volta per riposo lungo).
Furia elementale=Scegli un'opzione: una volta per turno, quando colpisci, infliggi 1d8 danni extra (freddo, fuoco, fulmine o tuono); oppure aggiungi il tuo modificatore di Saggezza ai danni dei tuoi trucchetti.
Furia elementale migliorata=Il danno extra di Furia Elementale sale a 2d8 e i tuoi trucchetti ottengono gittata maggiore.
Stile di combattimento=Scegli uno stile di combattimento (un talento di stile), come Arcieria, Difesa, Duellare, Combattere con armi grandi, Protezione o Combattere con due armi. Non puoi sceglierlo due volte.
Recuperare le forze=Come azione bonus recuperi 1d10 + il tuo livello da guerriero PF. Si recupera con un riposo breve o lungo.
Recuperare le forze@24=Come azione bonus recuperi 1d10 + il tuo livello da guerriero PF. Hai più usi con il livello: ne recuperi uno con un riposo breve e tutti con uno lungo.
Azione impetuosa=Per un turno puoi compiere un'azione aggiuntiva (oltre alla tua azione e a quella bonus). Usi: 1 (due dal livello 17), recuperati con un riposo breve o lungo.
Azione impetuosa@24=Nel tuo turno puoi compiere un'azione aggiuntiva (ma non l'azione Magia). Usi: 1 (due dal livello 17), recuperati con un riposo breve o lungo.
Indomito=Quando fallisci un TS puoi ripeterlo (nel 2024 aggiungendo il tuo livello da guerriero al tiro) e devi usare il nuovo risultato. Usi: 1 (livello 9), 2 (13), 3 (17), recuperati con un riposo lungo.
Mente tattica=Quando fallisci una prova di caratteristica puoi spendere un uso di Recuperare le Forze per aggiungere 1d10 al tiro; se la prova riesce, l'uso non viene consumato.
Spostamento tattico=Quando usi Recuperare le Forze puoi muoverti fino a metà della tua velocità senza provocare attacchi di opportunità.
Maestro tattico=Quando attacchi con un'arma di cui puoi usare la padronanza, puoi sostituire la sua proprietà con Spingere, Rallentare o Sfinire per quell'attacco.
Attacchi studiati=Se manchi un attacco contro una creatura, hai vantaggio al tuo prossimo tiro per colpirla prima della fine del tuo turno successivo.
Attacco furtivo=Una volta per turno infliggi danni extra a una creatura che colpisci se hai vantaggio al tiro, oppure se un alleato non incapacitato è entro 1,5 m dal bersaglio e tu non hai svantaggio. Serve un'arma accurata o a distanza. I danni sono 1d6 al livello 1 e crescono di 1d6 ogni due livelli (fino a 10d6).
Gergo dei ladri=Conosci il Gergo dei ladri, un codice segreto di segni e parole con cui puoi nascondere messaggi comprensibili solo agli altri ladri.
Azione scaltra=Come azione bonus puoi usare Scattare, Disimpegnarsi o Nascondersi.
Schivata prodigiosa=Quando un attacco ti colpisce e vedi chi attacca, puoi usare la reazione per dimezzare i danni.
Eludere=Quando sei bersaglio di un effetto che permette un TS su Destrezza per dimezzare i danni, non subisci danni se riesci e ne subisci la metà se fallisci (non vale se sei incapacitato).
Talento affidabile=Quando fai una prova di abilità in cui sei competente, un risultato del d20 inferiore a 10 conta come 10.
Percezione cieca=Se puoi sentire, percepisci la posizione di creature nascoste o invisibili entro 3 m.
Mente sfuggente=Ottieni competenza nei tiri salvezza su Saggezza.
Mente sfuggente@24=Ottieni competenza nei tiri salvezza su Saggezza e Carisma.
Elusivo=Nessun tiro per colpirti ha vantaggio finché non sei incapacitato.
Colpo di fortuna=Se manchi un attacco o fallisci una prova di caratteristica, puoi trasformare il risultato in un 20 naturale. Una volta per riposo breve o lungo.
Mira salda=Come azione bonus ottieni vantaggio al prossimo tiro per colpire del turno se non ti sei mosso; la tua velocità scende a 0 fino alla fine del turno.
Colpo astuto=Quando infliggi Attacco Furtivo puoi rinunciare ad alcuni dei suoi dadi per applicare un effetto, per esempio avvelenare il bersaglio, farlo cadere a terra o ritirarti senza subire attacchi di opportunità.
Colpo astuto migliorato=Puoi applicare due effetti di Colpo Astuto con lo stesso Attacco Furtivo, pagandone i costi.
Colpi subdoli=Ottieni nuovi effetti per Colpo Astuto, come stordire, mettere fuori combattimento e ostacolare la vista del bersaglio.
Incantesimi~Mago=Lanci incantesimi da mago con Intelligenza, usando un libro degli incantesimi: ne copi di nuovi a ogni livello e prepari ogni giorno quelli da lanciare. Puoi lanciare rituali direttamente dal libro.
Recupero arcano=Una volta al giorno, dopo un riposo breve, recuperi slot incantesimo spesi con livelli combinati pari o inferiori a metà del tuo livello da mago (arrotondato per eccesso), nessuno di livello 6 o superiore.
Rituali esperti=Puoi lanciare come rituale qualsiasi incantesimo con quel tag presente nel tuo libro, senza averlo preparato.
Studioso=Ottieni maestria in due abilità in cui sei già competente, scelte fra Arcano, Storia, Indagare, Medicina, Natura e Religione.
Memorizzare incantesimo=Quando finisci un riposo breve puoi sostituire uno degli incantesimi preparati con un altro del tuo libro degli incantesimi.
Maestria negli incantesimi=Scegli un incantesimo di 1° livello e uno di 2° livello del tuo libro: puoi lanciarli al loro livello minimo senza spendere slot.
Incantesimi distintivi=Scegli due incantesimi di 3° livello: sono sempre preparati e puoi lanciare ciascuno una volta per riposo breve o lungo senza slot, al 3° livello.
Arti marziali=Con le armi da monaco e gli attacchi senza armi usi Destrezza al posto di Forza. Il dado dei danni senza armi cresce con il livello (d4, d6, d8, d10, d12) e, quando attacchi, puoi dare un colpo senza armi extra come azione bonus.
Arti marziali@24=Usi Destrezza per gli attacchi senza armi e con armi da monaco, con un dado di Arti Marziali che cresce con il livello (d6, d8, d10, d12) e puoi dare un colpo senza armi come azione bonus.
Ki=Hai punti ki (pari al tuo livello da monaco, dal livello 2) da spendere per Raffica di colpi, Difesa paziente e Passo del vento. Si recuperano con un riposo breve o lungo. CD ki = 8 + competenza + Saggezza.
Movimento senza armatura=Senza armatura né scudo la tua velocità aumenta (+3 m al livello 2, fino a +9 m al 18). Dal livello 9 puoi correre su superfici verticali e liquide senza cadere.
Movimento senza armatura migliorato=Puoi muoverti su pareti verticali e su superfici liquide durante il tuo turno senza cadere.
Deviare proiettili=Come reazione, quando un attacco a distanza ti colpisce, riduci i danni di 1d10 + Destrezza + livello da monaco. Se scendono a 0 puoi spendere 1 ki per rilanciare il proiettile.
Caduta lenta=Come reazione, quando cadi, riduci i danni da caduta di cinque volte il tuo livello da monaco.
Colpo stordente=Quando colpisci con un attacco in mischia puoi spendere 1 ki: il bersaglio fa un TS su Costituzione o è stordito fino alla fine del tuo prossimo turno.
Colpi potenziati dal ki=I tuoi colpi senza armi contano come magici per superare resistenze e immunità.
Mente serena=Come azione puoi terminare un effetto che ti rende ammaliato o spaventato.
Purezza del corpo=Sei immune a malattie e veleni.
Lingua del sole e della luna=Capisci tutte le lingue parlate e qualsiasi creatura che parli capisce ciò che dici.
Anima di diamante=Ottieni competenza in tutti i tiri salvezza. Puoi spendere 1 ki per ripetere un TS fallito.
Corpo vuoto=Con 4 ki diventi invisibile per 1 minuto e ottieni resistenza a tutti i danni tranne la forza; con 8 ki lanci Forma astrale.
Sé perfetto=Quando tiri l'iniziativa e non hai punti ki, ne recuperi 4.
Focus del monaco=Hai Punti Focus (pari al tuo livello) da spendere per Raffica di colpi, Difesa paziente e Passo del vento. Si recuperano con un riposo breve o lungo.
Metabolismo straordinario=Quando tiri l'iniziativa puoi recuperare tutti i tuoi Punti Focus e curarti di un tiro del dado di Arti Marziali + il tuo livello da monaco (una volta per riposo lungo).
Deviare attacchi=Come reazione riduci i danni di un attacco subito di 1d10 + Destrezza + livello da monaco. Se scendono a 0 puoi spendere 1 Punto Focus per reindirizzare il colpo su un altro bersaglio.
Colpi potenziati=I tuoi attacchi senza armi possono infliggere danni da forza.
Movimento acrobatico=Durante il tuo turno ti muovi lungo superfici verticali e sul liquido senza cadere.
Focus accresciuto=Raffica di colpi, Difesa paziente e Passo del vento ottengono effetti potenziati (più attacchi, PF temporanei, possibilità di trasportare una creatura).
Autoguarigione=A ogni turno puoi rimuovere da te una condizione fra affascinato, spaventato o avvelenato. Non hai più bisogno di cibo e acqua.
Deviare energia=Deviare Attacchi funziona contro qualsiasi tipo di danno, non solo contundente, perforante e tagliente.
Sopravvissuto disciplinato=Ottieni competenza in tutti i tiri salvezza. Puoi spendere 1 Punto Focus per ripetere un TS fallito.
Focus perfetto=Quando tiri l'iniziativa e hai 3 o meno Punti Focus, ne recuperi fino ad averne 4.
Difesa superiore=Spendendo 3 Punti Focus, per 1 minuto ottieni resistenza a tutti i danni tranne quelli da forza.
Corpo e mente=I tuoi punteggi di Destrezza e Saggezza aumentano di 4 (massimo 25).
Percezione divina=Come azione percepisci celestiali, immondi e non morti entro 18 m fuori da copertura totale, e luoghi o oggetti consacrati o dissacrati. Usi: 1 + modificatore di Carisma, per riposo lungo.
Imposizione delle mani=Hai una riserva di guarigione pari a 5 × il tuo livello da paladino. Come azione tocchi una creatura e ne recuperi PF dalla riserva, oppure spendi 5 punti per curare una malattia o un veleno.
Imposizione delle mani@24=Hai una riserva di guarigione pari a 5 × il tuo livello da paladino. Come azione bonus tocchi una creatura e ne recuperi PF dalla riserva, oppure spendi 5 punti per rimuovere l'avvelenamento. Si ricarica con un riposo lungo.
Incantesimi~Paladino=Lanci incantesimi da paladino con Carisma, preparandoli ogni giorno dalla lista della classe e usando un simbolo sacro come focus.
Punizione divina=Quando colpisci con un attacco in mischia con arma puoi spendere uno slot incantesimo per infliggere 2d8 danni radiosi extra (+1d8 per ogni livello di slot sopra il primo, massimo 5d8; +1d8 contro immondi e non morti).
Salute divina=Sei immune alle malattie.
Aura di protezione=Tu e le creature alleate entro 3 m (9 m dal livello 18) aggiungete il tuo modificatore di Carisma (minimo +1) ai tiri salvezza.
Aura di coraggio=Tu e gli alleati entro 3 m non potete essere spaventati finché sei cosciente.
Punizione divina migliorata=Tutti i tuoi colpi in mischia con arma infliggono 1d8 danni radiosi extra.
Tocco purificatore=Come azione puoi terminare un incantesimo su di te o su una creatura consenziente che tocchi. Usi pari al modificatore di Carisma (minimo 1), per riposo lungo.
Aure migliorate=Il raggio delle tue aure di Protezione e di Coraggio aumenta a 9 metri.
Punizione del paladino=Hai sempre preparato Punizione Divina e puoi lanciarla una volta per riposo lungo senza spendere slot.
Incanalare divinità~Paladino=Hai 2 usi di Incanalare Divinità (3 dal livello 11), per Percezione divina e per le opzioni del tuo giuramento. Ne recuperi uno con un riposo breve e tutti con uno lungo.
Destriero fedele=Puoi lanciare Trova destriero senza slot una volta per riposo lungo.
Scacciare i nemici=Quando usi Incanalare Divinità puoi spaventare le creature nemiche entro 18 m che falliscono un TS su Saggezza: fuggono e restano spaventate per 1 minuto.
Colpi radiosi=I tuoi attacchi con armi e senz'armi infliggono 1d8 danni radiosi extra.
Tocco ristoratore=Quando usi Imposizione delle mani puoi rimuovere anche una condizione come accecato, assordato, paralizzato, stordito o avvelenato, spendendo 5 punti in più.
Espansione dell'aura=Il raggio dell'Aura di Protezione e dell'Aura di Coraggio sale a 9 metri.
Nemico prescelto=Scegli un tipo di nemico (per esempio bestie, mostruosità, non morti): hai vantaggio alle prove di Saggezza (Sopravvivenza) per tracciarli e di Intelligenza per ricordare informazioni su di loro, e impari una lingua. Altri tipi ai livelli 6 e 14.
Nemico prescelto@24=Hai sempre preparato Marchio del cacciatore e puoi lanciarlo senza slot un numero di volte che cresce con il livello; infligge danni extra al bersaglio segnato.
Esploratore nato=Scegli un tipo di terreno favorito: viaggio, foraggiamento e tracciamento sono potenziati, non sei rallentato dal terreno difficile e raddoppi il bonus di competenza per le prove di Intelligenza o Saggezza su quel terreno. Altri terreni ai livelli 6 e 10.
Incantesimi~Ranger=Lanci incantesimi da ranger con Saggezza, usando un focus druidico e preparandoli (o conoscendoli) dalla lista della classe.
Consapevolezza primordiale=Spendendo uno slot incantesimo percepisci per 1 minuto per livello dello slot la presenza di certi tipi di creature entro 1,5 km (9 km nel terreno favorito).
Passo della terra=Muoverti in terreno difficile non magico non costa movimento extra, e hai vantaggio ai TS contro piante rampicanti e simili.
Nascondersi in piena vista=Dedicando 1 minuto a camuffarti con la vegetazione ottieni +10 alle prove di Furtività finché non ti muovi o agisci.
Svanire=Puoi usare Nascondersi come azione bonus e non puoi essere tracciato con mezzi non magici.
Sensi ferali=Se non sei accecato, attacchi senza svantaggio le creature che non vedi entro 9 m e ne conosci la posizione se non sono nascoste.
Sterminatore di nemici=Una volta per turno aggiungi il tuo modificatore di Saggezza a un tiro per colpire o per i danni contro un nemico prescelto.
Sterminatore di nemici@24=Il dado di danno di Marchio del cacciatore diventa un d10.
Nemico prescelto ed esploratore nato migliorati=Scegli un nuovo tipo di nemico prescelto e un nuovo terreno favorito.
Esploratore nato migliorato=Scegli un terreno favorito aggiuntivo.
Nemico prescelto migliorato=Scegli un tipo di nemico prescelto aggiuntivo.
Esploratore esperto=Ottieni maestria in un'abilità e impari due lingue; ottieni inoltre competenza in un'abilità della lista del ranger.
Girovagare=La tua velocità aumenta di 3 m e ottieni velocità di scalata e di nuoto pari alla tua velocità.
Instancabile=Come azione magica ottieni PF temporanei (1d8 + Saggezza); usi pari al modificatore di Saggezza per riposo lungo. Con un riposo breve riduci inoltre di 1 il livello di sfinimento.
Cacciatore implacabile=La concentrazione su Marchio del cacciatore non si interrompe quando subisci danni.
Velo della natura=Come azione bonus diventi invisibile fino alla fine del tuo prossimo turno. Usi pari al modificatore di Saggezza per riposo lungo.
Cacciatore preciso=Hai vantaggio ai tiri per colpire contro la creatura segnata da Marchio del cacciatore.
Incantesimi~Stregone=Lanci incantesimi da stregone con Carisma, usando un focus arcano. Conosci un numero fisso di incantesimi (nel 2024 li prepari).
Fonte di magia=Hai punti stregoneria (pari al tuo livello da stregone, dal livello 2): puoi convertire punti in slot incantesimo e viceversa. Li recuperi con un riposo lungo.
Metamagia=Scegli opzioni di Metamagia (2 al livello 3, altre ai livelli 10 e 17) che applichi agli incantesimi spendendo punti stregoneria, per esempio incantesimo gemello, rapido, distante o potenziato. Puoi sostituirne una quando sali di livello.
Ripristino stregonesco=Quando finisci un riposo breve recuperi 4 punti stregoneria.
Ripristino stregonesco@24=Una volta per riposo lungo, dopo un riposo breve recuperi punti stregoneria fino a metà del tuo livello da stregone.
Stregoneria innata=Come azione bonus liberi la magia innata per 1 minuto: la CD dei tuoi incantesimi aumenta di 1 e hai vantaggio ai tiri per colpire con incantesimi da stregone. Hai 2 usi, recuperati con un riposo lungo.
Stregoneria incarnata=Se non hai usi di Stregoneria Innata, ne recuperi uno. Mentre Stregoneria Innata è attiva puoi applicare due opzioni di Metamagia allo stesso incantesimo.
Apoteosi arcana=Mentre Stregoneria Innata è attiva puoi usare una Metamagia per turno senza spendere punti stregoneria.
Magia del patto=Lanci incantesimi da warlock con Carisma. Hai pochi slot, tutti del livello più alto che puoi lanciare, e li recuperi con un riposo breve o lungo. Usi un focus arcano.
Invocazioni occulte=Scegli invocazioni occulte (2 al livello 2, altre salendo di livello) che ti danno capacità magiche permanenti o incantesimi a volontà. Puoi sostituirne una quando sali di livello.
Dono del patto=Scegli un dono per il tuo patto: Catena (un famiglio), Lama (un'arma del patto) o Tomo (un libro con trucchetti e rituali).
Arcanum mistico=Scegli un incantesimo di livello 6 (7 al livello 13, 8 al 15, 9 al 17): puoi lanciarlo una volta per riposo lungo senza slot.
Maestro occulto=Con 1 minuto di implorazione al tuo patrono recuperi tutti gli slot del patto spesi. Una volta per riposo lungo.
Astuzia magica=Con un rituale di 1 minuto recuperi fino a metà (arrotondata per eccesso) degli slot del patto spesi. Una volta per riposo lungo.
